name: Publish NPM Package

on:
  release:
    types: published

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # fail before publishing if package.json points to files that weren't built
      - run: npx publint --strict
      # pre-release versions are published under the "next" tag, so "latest" is not changed.
      # stable versions use npm's default tag, which keeps npm's guard against moving
      # "latest" to a lower version
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
