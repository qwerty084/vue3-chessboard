name: Publish NPM Package

on:
  release:
    types: created

  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # pre-release versions are published under the "next" tag, so "latest" is not changed.
      # stable versions use npm's default tag, which keeps npm's guard against moving
      # "latest" to a lower version
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
